<!DOCTYPE html>
<html lang="pt">
<head>

    .card { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; padding: 24px; }
    .card a { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Modelos para Demonstração</h1>

    <div class="grid">
      <div class="card">
        <h2>Barbearia</h2>
        <p>Modelo de demonstração para barbearia.</p>
        <a href="https://felipemacedo1306-png.github.io/Modelo-barbearia-/" target="_blank">Abrir Modelo</a>
      </div>
      <div class="card">
        <h2>Hamburgueria</h2>

        <a href="https://felipemacedo1306-png.github.io/modelohamburgueria-/" target="_blank">Abrir Modelo</a>
      </div>
      <div class="card">
        <h2>Clínica Estética e Saúde</h2>
        <p>Modelo de demonstração para clínica.</p>
        <a href="https://felipemacedo1306-png.github.io/clinicaestetica-saude/" target="_blank">Abrir Modelo</a>
      </div>
    </div>
  </div>
</body>
</html>
